<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    (function (l) {
      // Kiểm tra nếu có tham số ?p= truyền từ 404.html sang
      if (l.search) {
        var params = new URLSearchParams(l.search);
        var p = params.get('p'); // Lấy đường dẫn con (ví dụ: /register)
        var q = params.get('q'); // Lấy query parameters nếu có (utm, fbclid...)

        if (p) {
          // Giải mã lại các ký tự ~and~ nếu có
          var cleanPath = p.replace(/~and~/g, '&');
          var newUrl = l.pathname.slice(0, -1) + cleanPath + l.hash;

          // Cập nhật lại thanh địa chỉ trình duyệt thành URL đẹp /dva/register
          window.history.replaceState(null, null, newUrl);
        }
      }
    }(window.location))
  </script>
</head>

<body>
</body>

</html>
